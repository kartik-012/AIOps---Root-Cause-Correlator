apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: aiops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: api-gateway
        image: python:3.11-slim
        command: ["python", "-c"]
        args:
          - |
            import http.server, socketserver
            class Handler(http.server.SimpleHTTPRequestHandler):
                def do_GET(self):
                    self.send_response(200)
                    self.send_header('Content-type', 'text/plain')
                    self.end_headers()
                    self.wfile.write(b'api-gateway ok\n')
            with socketserver.TCPServer(('', 8080), Handler) as httpd:
                httpd.serve_forever()
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: aiops-demo
spec:
  selector:
    app: api-gateway
  ports:
  - port: 8080
    targetPort: 8080
---
