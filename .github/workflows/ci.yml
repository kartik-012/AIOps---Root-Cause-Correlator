name: CI Pipeline — AIOps Distributed Platform

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Test Suite & Type Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aiops
          POSTGRES_PASSWORD: aiops_secret
          POSTGRES_DB: aiops_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest-cov

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://aiops:aiops_secret@127.0.0.1:5433/aiops_db
        run: |
          cd backend
          python -c "
          import time, psycopg2
          for i in range(30):
              try:
                  conn = psycopg2.connect('postgresql://aiops:aiops_secret@127.0.0.1:5433/aiops_db')
                  conn.close()
                  print('PostgreSQL connection established!')
                  break
              except Exception as e:
                  print(f'Waiting for PostgreSQL... ({e})')
                  time.sleep(1)
          else:
              raise SystemExit('Timed out waiting for PostgreSQL')
          "
          alembic upgrade head

      - name: Execute Full Test Suite
        env:
          DATABASE_URL: postgresql://aiops:aiops_secret@127.0.0.1:5433/aiops_db
          REDIS_URL: redis://127.0.0.1:6380/0
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend Production Build & Bundle Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: aiops-frontend/package-lock.json

      - name: Install Dependencies & Build
        run: |
          cd aiops-frontend
          npm install
          npm run build
